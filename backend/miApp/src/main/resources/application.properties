spring.application.name=miApp
spring.jackson.deserialization.fail-on-unknown-properties=true

# Plazos de cuestionarios; expresados como java.time.Duration.
cuestionario.plazo-activo=PT24H
cuestionario.plazo-completar=PT2H
# Valores operativos provisionales: el CU no fija estas cantidades.
cuestionario.preguntas-por-bloque=5
cuestionario.maximo-accesos=5
# CU032: frecuencia del proceso que finaliza cuestionarios vencidos (cron de Spring: seg min hora día mes díaSemana).
cuestionario.finalizacion.cron=${CUESTIONARIO_FINALIZACION_CRON:0 */5 * * * *}

# CU001: autenticación del consultor contra el LDAP de la organización.
# Si LDAP_URL está vacío se usa el consultor local (solo para desarrollo).
ldap.url=${LDAP_URL:}
ldap.dn-patron=${LDAP_DN_PATRON:uid={0},ou=consultores,dc=empresa,dc=com}
consultor.usuario-local=${CONSULTOR_USUARIO:}
consultor.contrasenia-local=${CONSULTOR_CONTRASENIA:}

# CU006: tamaño máximo del CSV de candidatos.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=jdbc:postgresql://localhost:5432/diseno_1
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Secreto HMAC para firmar los JWT. Definir como variable de entorno JWT_SECRET (mínimo 32 bytes).
seguridad.jwt.secret=${JWT_SECRET}

# Clave opcional: la aplicación puede iniciar sin ella, pero CU033 no estará disponible.
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-6.2-sol}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
