spring.application.name=miApp
spring.jackson.deserialization.fail-on-unknown-properties=true

# Plazos de cuestionarios; expresados como java.time.Duration.
cuestionario.plazo-activo=PT24H
cuestionario.plazo-completar=PT2H

spring.datasource.url=jdbc:postgresql://localhost:5432/diseno_1
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
